# Fund TSN-Affinity

If TSN-Affinity helps your research, please consider sponsoring its
continued development.

## Sponsorships

- **GitHub Sponsors** — preferred, supports recurring sponsorship via
  your GitHub account.
- **Open Collective** — transparent ledger, ideal for institutional
  backers.
- **Direct support** — for one-off support, contact the maintainer at
  [sachncs@gmail.com](mailto:sachncs@gmail.com).

## Acknowledgments

TSN-Affinity is a personal research project. Thanks to everyone who
has reported issues, contributed patches, or cited the project in
their work.
